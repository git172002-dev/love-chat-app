<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💚 Love Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#1a0a2e;overflow:hidden;}

.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
.blob1{width:clamp(200px,45vw,560px);height:clamp(200px,45vw,560px);background:rgba(109,168,50,0.18);top:-10%;left:-10%;animation:bm 8s ease-in-out infinite;}
.blob2{width:clamp(180px,38vw,480px);height:clamp(180px,38vw,480px);background:rgba(232,100,122,0.18);bottom:-8%;right:-8%;animation:bm 10s ease-in-out infinite reverse;}
.blob3{width:clamp(130px,22vw,320px);height:clamp(130px,22vw,320px);background:rgba(232,160,32,0.14);top:42%;left:48%;animation:bm 7s ease-in-out infinite 2s;}
@keyframes bm{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(18px,-18px) scale(1.09);}}

.layout{position:relative;z-index:1;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;}

.phone{
  display:flex;flex-direction:column;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.1);
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,0.55);
  width:100%;height:100vh;border-radius:0;
}
@media(min-width:600px){.phone{width:min(460px,88vw);height:min(800px,92vh);border-radius:36px;}}
@media(min-width:1024px){.phone{width:min(540px,44vw);height:min(860px,90vh);border-radius:42px;}}

/* Setup / Welcome Screen */
.setup{
  padding:clamp(1.5rem,4vw,2.5rem);color:#fff;
  justify-content:center; overflow-y: auto; text-align:center;
}
.setup h2{font-family:'Playfair Display',serif; margin-bottom:0.5rem; color:#a8cc68; font-size:clamp(1.4rem,3.5vw,1.8rem);}
.setup .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem; text-align:left;}
.setup label{font-size:0.85rem; color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.05em; font-weight: 500;}
.setup input{
  background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.15);
  color:#fff; padding:0.9rem 1rem; border-radius:14px; outline:none;
  font-family:inherit;font-size:1rem;transition:border-color 0.3s;
}
.setup input:focus{border-color:#a8cc68;background:rgba(0,0,0,0.4);}
.setup button{
  background:linear-gradient(135deg,#6da832,#4a7c1f); color:#fff; border:none; 
  padding:1rem; border-radius:14px; font-weight:bold; cursor:pointer; 
  margin-top:0.5rem;font-family:inherit;font-size:1rem;transition:transform 0.2s,box-shadow 0.2s;
  width: 100%;
}
.setup button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(109,168,50,0.3);}
.setup button:active{transform:scale(0.98);}

.magic-box {
    background: rgba(109,168,50,0.1); border: 1px dashed rgba(109,168,50,0.5);
    padding: 1rem; border-radius: 12px; margin-top: 1.5rem;
}

/* Header */
.header{
  padding:clamp(.85rem,2.2vw,1.3rem) clamp(.9rem,2.8vw,1.5rem);
  background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;gap:clamp(.7rem,1.8vw,1rem);flex-shrink:0;
}
.avatar{
  width:clamp(40px,6.5vw,54px);height:clamp(40px,6.5vw,54px);
  border-radius:50%;background:linear-gradient(135deg,#6da832,#a8cc68);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.3rem,2.8vw,1.8rem);flex-shrink:0;animation:glow 3s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(109,168,50,.4),0 0 12px rgba(109,168,50,.2);}50%{box-shadow:0 0 0 3.5px rgba(109,168,50,.75),0 0 30px rgba(109,168,50,.42);}}
.hname{font-family:'Playfair Display',serif;font-size:clamp(.98rem,2.2vw,1.18rem);color:#fff;font-style:italic;}
.hstatus{font-size:clamp(.63rem,1.3vw,0.76rem);color:#a8cc68;display:flex;align-items:center;gap:5px;margin-top:2px;}
.sdot{width:6px;height:6px;border-radius:50%;background:#a8cc68;animation:sp 2s ease-in-out infinite;}
@keyframes sp{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}

/* Messages */
.messages{
  flex:1;overflow-y:auto;padding:clamp(.75rem,1.8vw,1.2rem);
  display:flex;flex-direction:column;gap:clamp(.35rem,1vw,.65rem);scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{display:none;}

.bwrap{display:flex;animation:popIn .38s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes popIn{from{opacity:0;transform:scale(.25) translateY(24px);}to{opacity:1;transform:scale(1) translateY(0);}}
.bwrap.me{justify-content:flex-end;}.bwrap.her{justify-content:flex-start;}

.bubble{
  font-size:clamp(2rem,5.5vw,3.2rem);line-height:1;
  padding:clamp(.4rem,1.2vw,.7rem) clamp(.45rem,1.2vw,.7rem);
  border-radius:22px;text-align:center;cursor:default;
  transition:transform .15s;user-select:none;
}
.bubble:hover{transform:scale(1.15);}
.bwrap.me .bubble{background:linear-gradient(135deg,rgba(109,168,50,.33),rgba(74,124,31,.5));border:1px solid rgba(109,168,50,.38);border-bottom-right-radius:5px;}
.bwrap.her .bubble{background:linear-gradient(135deg,rgba(232,100,122,.28),rgba(180,60,90,.44));border:1px solid rgba(232,100,122,.32);border-bottom-left-radius:5px;}

/* Bottom */
.bottom{
  padding:clamp(.7rem,1.8vw,1.1rem) clamp(.85rem,2.2vw,1.4rem) clamp(.85rem,2.2vw,1.5rem);
  background:rgba(255,255,255,0.04);border-top:1px solid rgba(255,255,255,0.07);flex-shrink:0;
}
.ebgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.38rem,1.2vw,.7rem);margin-bottom:clamp(.38rem,1.2vw,.7rem);}
.ebgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.38rem,1.2vw,.7rem);max-width:calc(50% + clamp(.38rem,1.2vw,.7rem)/2);margin:0 auto;}

.ebtn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:clamp(13px,2.2vw,20px);
  padding:clamp(.58rem,1.7vw,1rem) .3rem;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:clamp(3px,.7vw,6px);transition:all .2s ease;
  position:relative;overflow:hidden;
}
.ebtn:hover{transform:translateY(-3px) scale(1.04);}
.ebtn:active{transform:scale(.88);}
.ebtn .ico{font-size:clamp(1.7rem,4.8vw,2.6rem);transition:transform .3s;}
.ebtn .lbl{font-size:clamp(.56rem,1.3vw,.68rem);color:rgba(255,255,255,.4);letter-spacing:.05em;text-transform:uppercase;transition:color .3s;}

.bkiss  {border-color:rgba(232,100,122,.38);}.bkiss:hover  {background:rgba(232,100,122,.22);}
.bhug   {border-color:rgba(109,168,50,.38); }.bhug:hover   {background:rgba(109,168,50,.22);}
.bcuddle{border-color:rgba(232,160,32,.38); }.bcuddle:hover{background:rgba(232,160,32,.22);}
.bno    {border-color:rgba(200,200,255,.22);}.bno:hover    {background:rgba(200,200,255,.1);}

.btoggle{border:1.5px solid rgba(255,255,255,.15); position:relative;}
.bflame{border-color:rgba(255,120,50,.25);}
.bflame .lbl{color:rgba(255,255,255,.35);}
.bflame.on{border-color:rgba(255,140,30,.75);background:rgba(255,110,20,.22);box-shadow:0 0 18px rgba(255,110,20,.35),inset 0 0 12px rgba(255,140,30,.15);}
.bflame.on .lbl{color:rgba(255,180,80,.9);}

.bheart{border-color:rgba(220,50,100,.25);}
.bheart .lbl{color:rgba(255,255,255,.35);}
.bheart.on{border-color:rgba(232,60,110,.8);background:rgba(220,50,100,.22);box-shadow:0 0 18px rgba(220,50,100,.35),inset 0 0 12px rgba(232,60,110,.15);}
.bheart.on .lbl{color:rgba(255,140,170,.9);}

.burst{position:fixed;font-size:clamp(.9rem,1.8vw,1.3rem);pointer-events:none;animation:ba 1s ease-out forwards;z-index:9999;}
@keyframes ba{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}}
#sl{position:fixed;inset:0;pointer-events:none;z-index:9999;}

.logout-btn {
  font-size:clamp(1rem,2.5vw,1.2rem); 
  cursor:pointer; 
  padding: 5px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  transition: background 0.2s;
}
.logout-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div id="sl"></div>

<div class="layout">
  
  <!-- Welcome / Link Generator Screen (No complex setup!) -->
  <div id="welcome-screen" class="phone setup" style="display:none;">
    <h2 style="font-size: 3rem; margin-bottom: 0;">💚</h2>
    <h2>Welcome to Love Chat</h2>
    <p style="margin-bottom:1.5rem;font-size:0.9rem;color:rgba(255,255,255,0.7);line-height:1.5;">
      If you are the creator, enter your database info to generate a <strong>Magic Invite Link</strong>.
      If you are the partner, you shouldn't be here—ask for the Magic Link!
    </p>
    
    <div id="setup-form" style="display: none; width: 100%;">
      <div class="form-group">
        <label>Your Name</label>
        <input id="in-name" type="text" placeholder="e.g. Boyfriend" />
      </div>
      <div class="form-group">
        <label>GitHub Repo</label>
        <input id="in-repo" type="text" placeholder="username/repo-name" />
      </div>
      <div class="form-group">
        <label>GitHub Token</label>
        <input id="in-token" type="password" placeholder="ghp_..." />
      </div>
      <button id="setup-btn" onclick="saveSetup()">Connect & Start Chatting 💚</button>
    </div>

    <button onclick="document.getElementById('setup-form').style.display='block'; this.style.display='none';">I am the Creator (Setup)</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="phone" style="display:none;">
    <div class="header">
      <div class="avatar">🥑</div>
      <div style="flex:1">
        <div class="hname" id="display-name">My Love 💚</div>
        <div class="hstatus"><div class="sdot"></div>online now</div>
      </div>
      <div class="logout-btn" onclick="copyMagicLink()" title="Copy Invite Link for Partner">💌</div>
    </div>

    <div class="messages" id="msgs">
      <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 1rem;">
        Messages are end-to-end encrypted in your GitHub Database.
      </div>
    </div>

    <div class="bottom">
      <div class="ebgrid">
        <button class="ebtn bkiss"   onclick="send('😘')"><span class="ico">😘</span><span class="lbl">Kiss</span></button>
        <button class="ebtn bhug"    onclick="send('🤗')"><span class="ico">🤗</span><span class="lbl">Hug</span></button>
        <button class="ebtn bcuddle" onclick="send('🥰')"><span class="ico">🥰</span><span class="lbl">Cuddle</span></button>
        <button class="ebtn bno"     onclick="send('🙅')"><span class="ico">🙅</span><span class="lbl">No</span></button>
      </div>
      <div class="ebgrid2">
        <button class="ebtn btoggle bflame" id="btn-flame" onclick="toggle('flame')">
          <span class="ico" id="ico-flame">🕯️</span>
          <span class="lbl" id="lbl-flame">Mood Off</span>
        </button>
        <button class="ebtn btoggle bheart" id="btn-heart" onclick="toggle('heart')">
          <span class="ico" id="ico-heart">🖤</span>
          <span class="lbl" id="lbl-heart">Heart Off</span>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
const ext=['💚','💕','🌸','✨','🍯','💛','💗','🌿'];

const toggleState={flame:false,heart:false};
const toggleConfig={
  flame:{ on: {ico:'🔥', lbl:'Mood On', burst:['🔥','✨','💛','🌟']}, off:{ico:'🕯️', lbl:'Mood Off', burst:['💨','🌑']} },
  heart:{ on: {ico:'❤️‍🔥', lbl:'Heart On', burst:['❤️‍🔥','💕','💖']}, off:{ico:'🖤', lbl:'Heart Off', burst:['💔','🖤']} }
};

let config = {
  repo: localStorage.getItem('ghRepo'),
  issue: localStorage.getItem('ghIssue'),
  token: localStorage.getItem('ghToken'),
  name: localStorage.getItem('ghName')
};

let lastCommentId = 0;
let isPolling = false;
let isInitialLoad = true;
let renderedMessageIds = new Set();

async function initApp() {
  // Check for Magic Link Hash!
  if (window.location.hash.startsWith('#invite=')) {
    try {
      const b64 = window.location.hash.replace('#invite=', '');
      const inviteData = JSON.parse(atob(b64));
      
      const partnerName = prompt("Magic Link Connected! 💌\nWhat is YOUR name? (e.g. Girlfriend)");
      if (!partnerName) return alert("You must enter a name!");

      localStorage.setItem('ghRepo', inviteData.r);
      localStorage.setItem('ghIssue', inviteData.i);
      localStorage.setItem('ghToken', inviteData.t);
      localStorage.setItem('ghName', partnerName);
      
      window.location.hash = ''; // Clear hash so it stays secret
      location.reload();
      return;
    } catch(e) {
      alert("Invalid Magic Link!");
    }
  }

  if (config.repo && config.issue && config.token && config.name) {
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('display-name').textContent = `Chatting as ${config.name}`;
    pollMessages();
    setInterval(pollMessages, 3000);
  } else {
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('welcome-screen').style.display = 'flex';
  }
}

async function saveSetup() {
  const name = document.getElementById('in-name').value.trim();
  const repo = document.getElementById('in-repo').value.trim();
  const token = document.getElementById('in-token').value.trim();
  
  if (!name || !repo || !token) return alert("Fill in all fields.");
  
  const btn = document.getElementById('setup-btn');
  btn.textContent = "Connecting... ⏳";
  btn.disabled = true;

  try {
    const createRes = await fetch(`https://api.github.com/repos/${repo}/issues`, {
      method: 'POST',
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'Love Chat Database 💚', body: 'Database' })
    });
    if (!createRes.ok) throw new Error("Failed to connect. Check token and repo.");
    
    const newIssue = await createRes.json();
    const issue = newIssue.number.toString();

    localStorage.setItem('ghName', name);
    localStorage.setItem('ghRepo', repo);
    localStorage.setItem('ghIssue', issue);
    localStorage.setItem('ghToken', token);
    location.reload();
  } catch (err) {
    alert(err.message);
    btn.textContent = "Connect & Start Chatting 💚";
    btn.disabled = false;
  }
}

function copyMagicLink() {
  const inviteData = {
    r: config.repo,
    i: config.issue,
    t: config.token
  };
  const b64 = btoa(JSON.stringify(inviteData));
  const link = window.location.origin + window.location.pathname + '#invite=' + b64;
  
  navigator.clipboard.writeText(link).then(() => {
    alert("💌 Magic Invite Link Copied!\n\nSend this link to your partner. When they click it, the chat will open instantly with NO setup required!");
  }).catch(() => {
    prompt("Copy this link and send it to your partner:", link);
  });
}

async function pollMessages() {
  if (isPolling) return;
  isPolling = true;
  try {
    const res = await fetch(`https://api.github.com/repos/${config.repo}/issues/${config.issue}/comments?per_page=100`, {
      headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    const comments = await res.json();
    
    let hasNew = false;
    comments.forEach(c => {
      if (c.id > lastCommentId) {
        lastCommentId = c.id;
        try {
          const payload = JSON.parse(c.body);
          appendMessageToUI(payload, isInitialLoad);
          hasNew = true;
        } catch(e) {}
      }
    });
    
    if (hasNew) {
      const msgs = document.getElementById('msgs');
      msgs.scrollTop = msgs.scrollHeight;
    }
    isInitialLoad = false;
  } catch(e) { }
  isPolling = false;
}

async function sendAction(actionType, content) {
  const localId = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  const payload = { sender: config.name, type: actionType, content: content, uuid: localId };
  appendMessageToUI(payload, false);

  try {
    await fetch(`https://api.github.com/repos/${config.repo}/issues/${config.issue}/comments`, {
      method: 'POST',
      headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: JSON.stringify(payload) })
    });
    setTimeout(pollMessages, 500);
  } catch(e) {}
}

function appendMessageToUI(payload, isHistory = false) {
  if (payload.uuid && renderedMessageIds.has(payload.uuid)) return;
  if (payload.uuid) renderedMessageIds.add(payload.uuid);
  
  const isMe = payload.sender === config.name;
  const msgs = document.getElementById('msgs');
  
  if (payload.type === 'emoji') {
    const w = document.createElement('div');
    w.className = 'bwrap ' + (isMe ? 'me' : 'her');
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = payload.content;
    
    if (!isMe && payload.sender) {
        const nameLbl = document.createElement('div');
        nameLbl.style.cssText = 'font-size:0.6rem; color:rgba(255,255,255,0.4); margin-bottom:2px; padding-left:10px;';
        nameLbl.textContent = payload.sender;
        const col = document.createElement('div');
        col.style.display = 'flex';
        col.style.flexDirection = 'column';
        col.appendChild(nameLbl); col.appendChild(b); w.appendChild(col);
    } else { w.appendChild(b); }

    msgs.appendChild(w);
    if (!isHistory) burst(b, ext);
    
  } else if (payload.type === 'toggle') {
     const { state, subtype } = payload.content;
     if (!isMe) updateToggleUI(subtype, state);
     
     const w = document.createElement('div');
     w.className = 'bwrap ' + (isMe ? 'me' : 'her');
     const b = document.createElement('div');
     b.className = 'bubble';
     b.textContent = toggleConfig[subtype][state ? 'on' : 'off'].ico;
     
     if (!isMe && payload.sender) {
        const nameLbl = document.createElement('div');
        nameLbl.style.cssText = 'font-size:0.6rem; color:rgba(255,255,255,0.4); margin-bottom:2px; padding-left:10px;';
        nameLbl.textContent = payload.sender;
        const col = document.createElement('div');
        col.style.display = 'flex';
        col.style.flexDirection = 'column';
        col.appendChild(nameLbl); col.appendChild(b); w.appendChild(col);
    } else { w.appendChild(b); }

     msgs.appendChild(w);
     if (!isHistory) burst(b, toggleConfig[subtype][state ? 'on' : 'off'].burst);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function send(emoji) { sendAction('emoji', emoji); }
function toggle(type) { const state = !toggleState[type]; updateToggleUI(type, state); sendAction('toggle', { subtype: type, state: state }); }
function updateToggleUI(type, state) {
  toggleState[type] = state;
  const cfg = toggleConfig[type], phase = state ? cfg.on : cfg.off;
  const btn = document.getElementById('btn-'+type), ico = document.getElementById('ico-'+type), lbl = document.getElementById('lbl-'+type);
  if (ico && lbl && btn) { ico.textContent = phase.ico; lbl.textContent = phase.lbl; btn.classList.toggle('on', state); }
}

function burst(el,symbols){
  const layer=document.getElementById('sl'), r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='burst'; s.textContent=symbols[i%symbols.length];
    const a=(i/12)*Math.PI*2,d=55+Math.random()*75;
    s.style.left=cx+'px'; s.style.top=cy+'px'; s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px'); s.style.animationDelay=(i*.04)+'s';
    layer.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

window.onload = initApp;
</script>
</body>
</html>
